name: Publish Docker image

# The sandbox the agent runs in. Built on every push to master rather than on
# tags: the image carries no source — it clones the repo at runtime — so it only
# changes when the tooling inside it does, and there is nothing to version
# separately from the code it runs. Also rebuilt weekly without the layer
# cache: the apt layers (Debian base, Google Chrome, gh) only refresh when they
# actually run, and with a cache they ran once in September and never again
# (Chrome fell 5 majors behind). A no-cache build picks up current packages;
# the agent then rolls itself onto the new image.

on:
  push:
    branches: [master]
    paths:
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - '.github/workflows/docker.yaml'
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch: {}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Single platform: the cluster this runs on is amd64, and a second
          # architecture roughly doubles build time for nothing.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Scheduled and manual runs refresh the apt layers; pushes stay fast.
          no-cache: ${{ github.event_name != 'push' }}
